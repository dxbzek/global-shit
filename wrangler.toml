name = "world-pulse"
main = "worker/index.ts"
compatibility_date = "2024-11-06"

# Serves the built single-page app. Any path that is not /api/* falls through
# to these assets, so deep links like /?country=UA load the app shell.
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Continuous ingestion. One tick a minute, each handling a rotating shard of
# the feeds, so fresh items land every minute without polling any single
# upstream faster than it tolerates. See worker/pipeline.ts.
[triggers]
crons = ["* * * * *"]

# Cache for every data type.
#
# This id points at the "world-pulse" namespace on the repository owner's
# Cloudflare account. A namespace id is an account-scoped resource identifier,
# not a credential: reaching it still requires account authentication.
#
# Deploying to a different account means creating your own and replacing it:
#   npx wrangler kv namespace create world-pulse
[[kv_namespaces]]
binding = "WORLD_PULSE"
id = "26538a216120447c9f959d78bfe0193e"

[observability]
enabled = true
